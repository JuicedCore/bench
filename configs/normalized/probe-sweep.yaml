# NORMALIZED - runs on all five platforms, identical load and windows.
#
# Probe-and-sweep: floor latency, then step to saturation, then hold just below
# the knee. This is the primary methodology - docs/architecture/metrics-methodology.md.
#
#   set -a; source deploy/docker/<platform>/connection.env; set +a
#   benchrunner run --config configs/normalized/probe-sweep.yaml --platform <platform>
#
# Every platform is offered the SAME ladder. A platform that saturates at step 2
# is not given a shorter ladder to flatter it - it simply stops climbing, via
# abort_after_failed_steps, and the hold phase is retargeted to hold_fraction of
# the highest step it actually held. Skipped steps are recorded in the manifest.
name: probe-sweep
platform: fabric-cft        # nominal default; always pass --platform
workload: kv-write
profile: local
normalized: true

load:
  mode: open-loop
  key_distribution: uniform
  key_space: 200000
  value_size_bytes: 64
  finality_wait: 60s      # uniform across the normalized set: this is the
                          # cutoff that decides timed-out vs committed, so a
                          # tighter budget on one platform would manufacture
                          # failures. Generous costs a fast platform nothing.
  seed: 1
  sweep:
    enabled: true
    probe_tps: 10
    probe_duration: 30s
    steps: [100, 250, 500, 1000, 2000, 3500, 5000, 7500, 10000]
    step_duration: 60s
    hold_fraction: 0.9
    hold_duration: 5m
    max_fail_rate: 0.02
    abort_after_failed_steps: 2

metrics:
  warmup: 30s
  cooldown: 15s
  output_dir: ./results
  output_format: csv

# --- Everything below is identical in every configs/normalized/*.yaml ---

system_metrics:
  enabled: true
  sample_interval: 1s
  prometheus_url: http://localhost:9090
  cadvisor_url: http://localhost:8080
  # Union of every platform's container name prefixes. Names that do not match
  # anything on the platform under test are simply inert, which is what lets one
  # file serve all five.
  container_names:
    - peer          # fabric-cft, fabric-bft, drunix chaincode (dev-peer*)
    - lp1.          # drunix Lite Peers
    - cp.org        # drunix Committing Peers
    - vs1.          # drunix validation services
    - orderer
    - fabric
    - drunix
    - keydb
    - yugabyte
    - fabricx       # fabricx (fabricx-arma / -db / -pipeline / -committer)
    - neuchain      # neuchain
    - block-server
    - epoch-server

# Union of every adapter's keys. Each adapter reads only the keys it knows
# (configFromExtra is a key lookup, unknown keys are ignored) and an undefined
# ${VAR} expands to the empty string, so the block is inert for the platforms it
# does not apply to. Source the target platform's connection.env before running.
adapter:
  # fabric-cft / fabric-bft / drunix
  peer_endpoint: "${BENCH_ADAPTER_PEER_ENDPOINT}"
  endorse_endpoint: "${BENCH_ADAPTER_ENDORSE_ENDPOINT}"
  commit_endpoint: "${BENCH_ADAPTER_COMMIT_ENDPOINT}"
  gateway_peer: "${BENCH_ADAPTER_GATEWAY_PEER}"
  msp_id: "${BENCH_ADAPTER_MSP_ID}"
  cert_path: "${BENCH_ADAPTER_CERT_PATH}"
  key_path: "${BENCH_ADAPTER_KEY_PATH}"
  tls_ca_cert_path: "${BENCH_ADAPTER_TLS_CA_CERT_PATH}"
  channel: "${BENCH_ADAPTER_CHANNEL}"
  chaincode: "${BENCH_ADAPTER_CHAINCODE}"
  # fabricx: native gRPC. Submit by broadcasting to the Arma router, read
  # finality from the sidecar's deliver stream. signing_key_path is the key whose
  # public half is registered as the namespace policy at deploy time.
  broadcast_endpoint: "${BENCH_ADAPTER_BROADCAST_ENDPOINT}"
  deliver_endpoint: "${BENCH_ADAPTER_DELIVER_ENDPOINT}"
  channel_id: "${BENCH_ADAPTER_CHANNEL_ID}"
  namespace: "${BENCH_ADAPTER_NAMESPACE}"
  signing_key_path: "${BENCH_ADAPTER_SIGNING_KEY_PATH}"
  # neuchain
  block_servers: "${BENCH_ADAPTER_BLOCK_SERVERS}"
  query_endpoint: "${BENCH_ADAPTER_QUERY_ENDPOINT}"
  user_priv_key_path: "${BENCH_ADAPTER_USER_PRIV_KEY_PATH}"
  user_pub_key_path: "${BENCH_ADAPTER_USER_PUB_KEY_PATH}"
  func_name: "${BENCH_ADAPTER_FUNC_NAME}"
  table_name: "${BENCH_ADAPTER_TABLE_NAME}"
  poll_interval: 50ms
  # all platforms
  metrics_endpoint: "${BENCH_ADAPTER_METRICS_ENDPOINT}"
