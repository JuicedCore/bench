# Fixed moderate offered rate, long hold: clean p50/p95/p99/p99.9 end-to-end
# latency well below saturation. Run this after probe-sweep tells you the knee,
# with target_tps set to ~60% of it.
name: latency-profile
platform: fabric-cft
workload: kv-write
profile: local
normalized: true

load:
  mode: open-loop
  target_tps: 1000          # set to ~60% of the detected saturation TPS
  hold_duration: 10m
  key_distribution: uniform
  key_space: 500000
  value_size_bytes: 64
  finality_wait: 30s
  seed: 1

metrics:
  warmup: 60s
  cooldown: 30s
  output_dir: ./results
  output_format: json

system_metrics:
  enabled: true
  sample_interval: 1s
  container_names: ["peer", "orderer", "fabric", "drunix"]

adapter:
  peer_endpoint: "${BENCH_ADAPTER_PEER_ENDPOINT}"
  endorse_endpoint: "${BENCH_ADAPTER_ENDORSE_ENDPOINT}"
  commit_endpoint: "${BENCH_ADAPTER_COMMIT_ENDPOINT}"
  gateway_peer: "${BENCH_ADAPTER_GATEWAY_PEER}"
  msp_id: "${BENCH_ADAPTER_MSP_ID}"
  cert_path: "${BENCH_ADAPTER_CERT_PATH}"
  key_path: "${BENCH_ADAPTER_KEY_PATH}"
  tls_ca_cert_path: "${BENCH_ADAPTER_TLS_CA_CERT_PATH}"
  channel: "${BENCH_ADAPTER_CHANNEL}"
  chaincode: "${BENCH_ADAPTER_CHAINCODE}"
  metrics_endpoint: "${BENCH_ADAPTER_METRICS_ENDPOINT}"
