# High-conflict workload: Zipfian keys over a small key space with the transfer
# workload (read-modify-write two accounts). Measures MVCC-conflict handling -
# expect a non-zero failure rate on Fabric/Drunix as hot keys collide.
name: contention
platform: fabric-cft
workload: transfer
profile: local
normalized: true

load:
  mode: open-loop
  target_tps: 800
  hold_duration: 5m
  key_distribution: zipfian
  zipfian_constant: 1.2       # higher = hotter keys
  key_space: 2000
  finality_wait: 45s
  seed: 1

metrics:
  warmup: 30s
  cooldown: 15s
  output_dir: ./results
  output_format: csv

system_metrics:
  enabled: true
  sample_interval: 1s
  container_names: ["peer", "orderer", "fabric", "drunix"]

adapter:
  peer_endpoint: "${BENCH_ADAPTER_PEER_ENDPOINT}"
  endorse_endpoint: "${BENCH_ADAPTER_ENDORSE_ENDPOINT}"
  commit_endpoint: "${BENCH_ADAPTER_COMMIT_ENDPOINT}"
  gateway_peer: "${BENCH_ADAPTER_GATEWAY_PEER}"
  msp_id: "${BENCH_ADAPTER_MSP_ID}"
  cert_path: "${BENCH_ADAPTER_CERT_PATH}"
  key_path: "${BENCH_ADAPTER_KEY_PATH}"
  tls_ca_cert_path: "${BENCH_ADAPTER_TLS_CA_CERT_PATH}"
  channel: "${BENCH_ADAPTER_CHANNEL}"
  chaincode: "${BENCH_ADAPTER_CHAINCODE}"
  metrics_endpoint: "${BENCH_ADAPTER_METRICS_ENDPOINT}"
