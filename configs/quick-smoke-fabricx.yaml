# 30s Fabric-X sanity run. Uses the `transfer` workload -> the real token
# transfer REST route (works today). `kv-write` needs the custom view service
# (deploy/docker/fabricx/kvview) finished - Phase 3.
#
#   bash deploy/docker/fabricx/up.sh local
#   set -a; source deploy/docker/fabricx/connection.env; set +a
#   benchrunner run --config configs/quick-smoke-fabricx.yaml --platform fabricx
name: quick-smoke-fabricx
platform: fabricx
workload: transfer
profile: local
normalized: false        # token transfer is Fabric-X native; not the normalized bucket

load:
  mode: closed-loop      # the token POST blocks to finality; closed-loop fits
  workers: 8
  hold_duration: 30s
  key_distribution: uniform
  key_space: 2           # alice <-> bob
  finality_wait: 120s
  seed: 1

metrics:
  warmup: 5s
  cooldown: 3s
  output_dir: ./results
  output_format: json

system_metrics:
  enabled: true
  sample_interval: 1s
  container_names: ["fabricx", "owner", "issuer", "endorser", "committer", "arma"]

adapter:
  owner_url: "${BENCH_ADAPTER_OWNER_URL}"
  issuer_url: "${BENCH_ADAPTER_ISSUER_URL}"
  kv_url: "${BENCH_ADAPTER_KV_URL}"
  sender_account: "${BENCH_ADAPTER_SENDER_ACCOUNT}"
  counterparty_node: "${BENCH_ADAPTER_COUNTERPARTY_NODE}"
  token_code: "${BENCH_ADAPTER_TOKEN_CODE}"
  metrics_endpoint: "${BENCH_ADAPTER_METRICS_ENDPOINT}"
