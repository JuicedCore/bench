# NATIVE (normalized: false) - Fabric-X only, tuned to this platform.
# Never mixed with the normalized bucket in one comparison (adr-013).
#
# Fabric-X transfer-based probe-and-sweep: adaptation of probe-sweep.yaml.
# transfer is synchronous-to-finality (service/fsc.go runs the ordering+finality
# view before the REST call returns - see pkg/adapters/fabricx/config.go), so
# offered TPS beyond what owner/issuer/committer can drain will show up as
# rising fail_rate/latency exactly like probe-sweep.yaml measures for the
# Fabric family. Lower step ceiling than the Fabric-family original - a
# synchronous REST call per tx has a much lower plausible ceiling than an
# async chaincode submit; adjust `steps` once a live run shows where this
# platform actually saturates.
#
#   bash deploy/docker/fabricx/up.sh local
#   set -a; source deploy/docker/fabricx/connection.env; set +a
#   benchrunner run --config configs/native/probe-sweep-fabricx.yaml --platform fabricx
name: probe-sweep-fabricx
platform: fabricx
workload: transfer
profile: local
normalized: false        # token transfer is Fabric-X native; not the normalized bucket

load:
  mode: open-loop
  key_distribution: uniform
  key_space: 2            # workload emits acct-000000000 / acct-000000001 -
                          # NOT alice/owner2. These must exist as real Fabric-X
                          # accounts before these numbers mean anything., the one pair known to be live Fabric-X identities
  finality_wait: 120s
  seed: 1
  sweep:
    enabled: true
    probe_tps: 2
    probe_duration: 30s
    steps: [5, 10, 20, 40, 80, 150]
    step_duration: 45s
    hold_fraction: 0.9
    hold_duration: 2m
    max_fail_rate: 0.02

metrics:
  warmup: 10s
  cooldown: 10s
  output_dir: ./results
  output_format: csv

system_metrics:
  enabled: true
  sample_interval: 1s
  container_names: ["fabricx", "owner", "issuer", "endorser", "committer", "arma"]

adapter:
  owner_url: "${BENCH_ADAPTER_OWNER_URL}"
  issuer_url: "${BENCH_ADAPTER_ISSUER_URL}"
  # Native runs use the token routes, never the KV view. Pinned empty so the
  # adapter takes the working `issue` path for writes instead of the kvview
  # stub (which answers /kv with 501).
  kv_url: ""
  sender_account: "${BENCH_ADAPTER_SENDER_ACCOUNT}"
  counterparty_node: "${BENCH_ADAPTER_COUNTERPARTY_NODE}"
  token_code: "${BENCH_ADAPTER_TOKEN_CODE}"
  metrics_endpoint: "${BENCH_ADAPTER_METRICS_ENDPOINT}"
