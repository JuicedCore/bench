# NATIVE (normalized: false) - Fabric-X only, tuned to this platform.
# Never mixed with the normalized bucket in one comparison (adr-013).
#
# Fabric-X transfer-based throughput scan: adaptation of throughput-scan.yaml.
# Cruder than probe-sweep-fabricx.yaml (linear ramp, no adaptive stepping) but
# faster for a first look at where the synchronous-to-finality transfer path
# falls over.
#
#   bash deploy/docker/fabricx/up.sh local
#   set -a; source deploy/docker/fabricx/connection.env; set +a
#   benchrunner run --config configs/native/throughput-scan-fabricx.yaml --platform fabricx
name: throughput-scan-fabricx
platform: fabricx
workload: transfer
profile: local
normalized: false        # token transfer is Fabric-X native; not the normalized bucket

load:
  mode: open-loop
  ramp_from: 2
  ramp_to: 150
  ramp_duration: 3m
  hold_duration: 1m
  key_distribution: uniform
  key_space: 2            # workload emits acct-000000000 / acct-000000001 -
                          # NOT alice/owner2. These must exist as real Fabric-X
                          # accounts before these numbers mean anything.
  finality_wait: 120s
  seed: 1

metrics:
  warmup: 15s
  cooldown: 10s
  output_dir: ./results
  output_format: csv

system_metrics:
  enabled: true
  sample_interval: 1s
  container_names: ["fabricx", "owner", "issuer", "endorser", "committer", "arma"]

adapter:
  owner_url: "${BENCH_ADAPTER_OWNER_URL}"
  issuer_url: "${BENCH_ADAPTER_ISSUER_URL}"
  # Native runs use the token routes, never the KV view. Pinned empty so the
  # adapter takes the working `issue` path for writes instead of the kvview
  # stub (which answers /kv with 501).
  kv_url: ""
  sender_account: "${BENCH_ADAPTER_SENDER_ACCOUNT}"
  counterparty_node: "${BENCH_ADAPTER_COUNTERPARTY_NODE}"
  token_code: "${BENCH_ADAPTER_TOKEN_CODE}"
  metrics_endpoint: "${BENCH_ADAPTER_METRICS_ENDPOINT}"
