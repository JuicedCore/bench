# Probe-and-sweep: floor latency, then step to saturation, then hold at 90% of
# the knee. This is the primary methodology - see
# docs/architecture/metrics-methodology.md.
#
#   source deploy/docker/<platform>/connection.env
#   benchrunner run --config configs/probe-sweep.yaml --platform fabric-cft
name: probe-sweep
platform: fabric-cft
workload: kv-write
profile: local
normalized: true

load:
  mode: open-loop
  key_distribution: uniform
  key_space: 200000
  value_size_bytes: 64
  finality_wait: 60s
  seed: 1
  sweep:
    enabled: true
    probe_tps: 10
    probe_duration: 30s
    steps: [100, 250, 500, 1000, 2000, 3500, 5000, 7500, 10000]
    step_duration: 60s
    hold_fraction: 0.9
    hold_duration: 5m
    max_fail_rate: 0.02

metrics:
  warmup: 15s          # per phase; probe/short steps fall back to full-phase
  cooldown: 10s
  output_dir: ./results
  output_format: csv

system_metrics:
  enabled: true
  sample_interval: 1s
  container_names: ["peer", "orderer", "fabric", "drunix"]

adapter:
  peer_endpoint: "${BENCH_ADAPTER_PEER_ENDPOINT}"
  endorse_endpoint: "${BENCH_ADAPTER_ENDORSE_ENDPOINT}"
  commit_endpoint: "${BENCH_ADAPTER_COMMIT_ENDPOINT}"
  gateway_peer: "${BENCH_ADAPTER_GATEWAY_PEER}"
  msp_id: "${BENCH_ADAPTER_MSP_ID}"
  cert_path: "${BENCH_ADAPTER_CERT_PATH}"
  key_path: "${BENCH_ADAPTER_KEY_PATH}"
  tls_ca_cert_path: "${BENCH_ADAPTER_TLS_CA_CERT_PATH}"
  channel: "${BENCH_ADAPTER_CHANNEL}"
  chaincode: "${BENCH_ADAPTER_CHAINCODE}"
  metrics_endpoint: "${BENCH_ADAPTER_METRICS_ENDPOINT}"
