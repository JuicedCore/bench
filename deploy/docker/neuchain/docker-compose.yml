# NeuChain topology - PHASE 4. 4 block servers + 1 epoch server (the local
# profile). Resource limits come from deploy/profiles/<profile>.yaml
# (neuchain.per_container); up.sh substitutes them via BENCH_NC_* env.
#
# Ports, config-file layout and CLI flags below are PLACEHOLDERS - fill in from
# the iDC-NEU/NeuChain@ev repo (its scripts/ or run guide) during Phase 4.
name: bench-neuchain

x-limits: &limits
  deploy:
    resources:
      limits:
        cpus: "${BENCH_NC_CPUS:-1.2}"
        memory: "${BENCH_NC_MEM:-1g}"

services:
  epoch-server:
    image: bench/neuchain:ev
    <<: *limits
    entrypoint: ["/usr/local/bin/epoch_server"]
    command: ["--config", "/etc/neuchain/epoch.conf"]      # PLACEHOLDER
    volumes: ["./conf:/etc/neuchain:ro"]
    ports: ["18000:18000"]                                  # PLACEHOLDER (epoch server; no adapter route)
    networks: [nc]

  block-server-0: &bs
    image: bench/neuchain:ev
    <<: *limits
    depends_on: [epoch-server]
    entrypoint: ["/usr/local/bin/block_server_test_comm"]
    command: ["--id", "0", "--config", "/etc/neuchain/block.conf"]   # PLACEHOLDER
    volumes: ["./conf:/etc/neuchain:ro"]
    # NeuChain block servers speak ZeroMQ on TWO sockets, not gRPC on one:
    # :5001 is the SUB (submit) target the client PUBs to, :7003 is the REP
    # (query) socket the finality poller uses for tip_query / block_query.
    # Host ports follow 5001+10n / 7003+10n per server so they match the
    # BENCH_ADAPTER_BLOCK_SERVERS / _QUERY_ENDPOINT that up.sh emits.
    ports: ["5001:5001", "7003:7003"]
    networks: [nc]

  block-server-1:
    <<: *bs
    command: ["--id", "1", "--config", "/etc/neuchain/block.conf"]
    ports: ["5011:5001", "7013:7003"]

  block-server-2:
    <<: *bs
    command: ["--id", "2", "--config", "/etc/neuchain/block.conf"]
    ports: ["5021:5001", "7023:7003"]

  block-server-3:
    <<: *bs
    command: ["--id", "3", "--config", "/etc/neuchain/block.conf"]
    ports: ["5031:5001", "7033:7003"]

networks:
  nc: {}
