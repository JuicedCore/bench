# Just the custom kv-write view service. The Fabric-X network (Arma + committer)
# and the token services (issuer/endorser/owner) come from fabric-x-samples
# itself - `tokens/` `make setup && make start` - see up.sh. This service joins
# the same `fabric_test` network so it can reach the committer / FSC config.
name: bench-fabricx-kvview

services:
  kvview:
    image: bench/fabricx-rest:latest
    build:
      context: kvview
    container_name: fabricx-kvview
    environment:
      KVVIEW_PORT: "9700"
      KVVIEW_CONF: /etc/fabricx/kvview
    volumes:
      # mount the devnet's FSC config so the view can join the network
      - ${FXS_DEVNET_CONF:-./.cache/fabric-x-samples/devnet/config}:/etc/fabricx/kvview:ro
    ports:
      - "9700:9700"
    networks:
      - fabric_test
    restart: unless-stopped

networks:
  fabric_test:
    name: fabric_test
    external: true
