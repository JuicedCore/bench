# Fabric-X benchmark topology: four containers from one image.
#
#   fabricx-arma      4-party / 1-shard Arma (16 processes: router, batcher,
#                     consenter, assembler x4). Publishes party 1's router and
#                     assembler, which is what the adapter broadcasts to.
#   fabricx-db        PostgreSQL, the committer's state store.
#   fabricx-pipeline  sidecar + verifier + coordinator.
#   fabricx-committer validator-committer + query service.
#
# The load generator is NOT here - Bench drives load from the host over gRPC.
#
# Static IPs: Arma's generated configs are IP-keyed, so the subnet is pinned.
# Resource limits here are placeholders: up.sh calls lib.sh apply_budget right
# after `compose up`, which splits the profile's total budget evenly across the
# containers that are actually running.
name: bench-fabricx

x-node: &node
  image: ${BENCH_FX_IMAGE:-bench/fabricx:local}
  restart: "no"
  cpus: ${BENCH_FX_CPUS:-0.8}
  mem_limit: ${BENCH_FX_MEM:-800m}
  memswap_limit: ${BENCH_FX_MEM:-800m}
  env_file: [./endpoints.env]

services:
  fabricx-db:
    <<: *node
    command: ["db"]
    networks: { fx: { ipv4_address: 172.29.0.11 } }
    volumes: ["fx-pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  fabricx-arma:
    <<: *node
    command: ["orderer"]
    depends_on:
      fabricx-db: { condition: service_healthy }
    networks: { fx: { ipv4_address: 172.29.0.10 } }
    volumes: ["fx-arma:/data/arma"]
    # All four parties' routers (broadcast) and party 1's assembler (deliver
    # fallback). The adapter submits to every router, as upstream's BFT client
    # does: only the primary batcher cuts batches, and a request that reaches it
    # via a secondary waits FirstStrikeThreshold (10s) first. Chosen to avoid
    # every port the other platforms and the monitoring stack use.
    ports: ["6022:6022", "6122:6122", "6222:6222", "6322:6322", "6023:6023"]

  fabricx-pipeline:
    <<: *node
    command: ["pipeline"]
    depends_on: [fabricx-arma]
    networks: { fx: { ipv4_address: 172.29.0.12 } }
    volumes: ["fx-ledger:/data/ledger"]
    # Sidecar deliver stream - this is where the adapter reads finality from.
    ports: ["4001:4001"]

  fabricx-committer:
    <<: *node
    command: ["committer"]
    depends_on: [fabricx-pipeline]
    networks: { fx: { ipv4_address: 172.29.0.13 } }
    # Committer metrics. 9643 is already reserved for fabricx in
    # deploy/docker/monitoring/prometheus.yml and collides with nothing.
    # QueryService GetRows listens on :7001 (sample query.yaml). Publish it so
    # kv-read can use the native query path from the host. Do not recreate a
    # running stack just to pick this up — next up.sh applies it.
    ports: ["9643:2116", "7001:7001"]

networks:
  fx:
    ipam:
      config: [{ subnet: 172.29.0.0/24 }]

volumes:
  fx-pgdata:
  fx-arma:
  fx-ledger:
