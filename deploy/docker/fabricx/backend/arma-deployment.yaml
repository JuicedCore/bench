# 4-party, 1-shard Arma, all packed in one container (matches
# docs/platforms/fabricx-comparability.md's self-built backend). TLS none on
# router/assembler so the committer sidecar can dial in with
# SC_SIDECAR_ORDERER_TLS_MODE=none, matching tokens/'s endorser (core.yaml:
# tls.enabled: false). Ports are container-internal; generate-arma.sh rebinds
# ListenAddress to 0.0.0.0 since all parties run in the same container.

Parties:
  - ID: 1
    AssemblerEndpoint: "127.0.0.1:6023"
    ConsenterEndpoint: "127.0.0.1:6025"
    RouterEndpoint: "127.0.0.1:6022"
    BatchersEndpoints:
      - "127.0.0.1:6024"

  - ID: 2
    AssemblerEndpoint: "127.0.0.1:6123"
    ConsenterEndpoint: "127.0.0.1:6125"
    RouterEndpoint: "127.0.0.1:6122"
    BatchersEndpoints:
      - "127.0.0.1:6124"

  - ID: 3
    AssemblerEndpoint: "127.0.0.1:6223"
    ConsenterEndpoint: "127.0.0.1:6225"
    RouterEndpoint: "127.0.0.1:6222"
    BatchersEndpoints:
      - "127.0.0.1:6224"

  - ID: 4
    AssemblerEndpoint: "127.0.0.1:6323"
    ConsenterEndpoint: "127.0.0.1:6325"
    RouterEndpoint: "127.0.0.1:6322"
    BatchersEndpoints:
      - "127.0.0.1:6324"

UseTLSRouter: "none"
UseTLSAssembler: "none"
