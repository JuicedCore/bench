global:
  scrape_interval: 1s
  scrape_timeout: 1s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: node
    static_configs:
      - targets: ["node_exporter:9100"]

  # Platform-native endpoints. INFORMATIONAL ONLY - never used in cross-platform
  # comparison (see docs/architecture/fairness-guarantees.md). Targets are
  # host.docker.internal so this stack can stay up while platform topologies
  # cycle. Missing targets simply show as "down".
  - job_name: fabric
    metrics_path: /metrics
    static_configs:
      - targets:
          - "host.docker.internal:9443"   # peer operations
          - "host.docker.internal:9444"   # orderer operations
        labels: {platform: fabric}

  - job_name: drunix
    metrics_path: /metrics
    static_configs:
      - targets:
          - "host.docker.internal:9443"   # orderer
          - "host.docker.internal:9444"   # lite peer org1
          - "host.docker.internal:9454"   # committing peer org1
          - "host.docker.internal:9445"   # lite peer org2
          - "host.docker.internal:9455"   # committing peer org2
        labels: {platform: drunix}

  - job_name: fabricx
    metrics_path: /metrics
    static_configs:
      - targets:
          - "host.docker.internal:9643"   # committer
          - "host.docker.internal:9644"   # arma consenter
        labels: {platform: fabricx}

  - job_name: neuchain
    metrics_path: /metrics
    static_configs:
      - targets:
          - "host.docker.internal:9743"   # block server (if built with metrics)
        labels: {platform: neuchain}
