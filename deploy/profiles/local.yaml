# Local resource profile: 16-core / 16 GB host.
#
#   Host OS         2 cores / 2 GB
#   Load generator  2 cores / 2 GB  (more for high-ceiling platforms, see load_gen_cpus)
#   Monitoring      1 core  / 1 GB  (Prometheus + Grafana + cAdvisor + node_exporter)
#   Platform under test         11 cores / 11 GB   <-- budget below
#
# For normalized runs the engine forces state_db=leveldb regardless of the value
# here, and the orderer_batch block MUST be identical across fabric-cft,
# fabric-bft, drunix and fabricx (it is - keep it that way).
name: local
budget:
  total_cpus: 11
  total_memory_gb: 11
  load_gen_cpus: 2

# Shared normalized block-cutting parameters for the Fabric family.
# Referenced by anchors so they cannot drift between platforms.
_orderer_batch_normalized: &orderer_batch_normalized
  max_message_count: 100
  absolute_max_bytes: "10 MB"
  preferred_max_bytes: "2 MB"
  batch_timeout: "1s"

# Native (normalized: false) batch: larger/faster cutting for throughput.
# BFT keeps a 1s timeout because agreement needs wall time the others do not.
_orderer_batch_native: &orderer_batch_native
  max_message_count: 500
  absolute_max_bytes: "10 MB"
  preferred_max_bytes: "4 MB"
  batch_timeout: "500ms"

_orderer_batch_native_bft: &orderer_batch_native_bft
  max_message_count: 250
  absolute_max_bytes: "10 MB"
  preferred_max_bytes: "4 MB"
  batch_timeout: "1s"

platforms:
  fabric-cft:
    nodes: {peer: 2, orderer: 1, chaincode: 2}
    state_db: leveldb
    orderer_batch: *orderer_batch_normalized
    orderer_batch_native: *orderer_batch_native

  fabric-bft:
    # SmartBFT needs 3f+1 orderers, minimum 4.
    nodes: {peer: 2, orderer: 4, chaincode: 2}
    state_db: leveldb
    orderer_batch: *orderer_batch_normalized
    orderer_batch_native: *orderer_batch_native_bft

  drunix:
    nodes: {lite_peer: 2, committing_peer: 2, validation_service: 2, orderer: 1, keydb: 2, yugabyte: 2, chaincode: 2}
    # Native backend. Normalized runs still request leveldb via the engine;
    # the shipped test-network only wires the full node set for Yugabyte.
    state_db: yugabyte
    orderer_batch: *orderer_batch_normalized
    orderer_batch_native: *orderer_batch_native

  fabricx:
    # Arma: routers + batchers + consenters + assemblers, plus endorser /
    # validator / committer microservices. Starved on a local host - see
    # docs/architecture/fairness-guarantees.md.
    nodes: {arma: 1, postgres: 1, pipeline: 1, committer: 1}
    load_gen_cpus: 3
    state_db: postgres
    orderer_batch: *orderer_batch_normalized
    orderer_batch_native: *orderer_batch_native

  neuchain:
    nodes: {block_server: 4, epoch_server: 4}  # epoch servers co-located, one per block-server container
    load_gen_cpus: 3
    state_db: leveldb
    orderer_batch: {}

  mock:
    nodes: {node: 1}
    state_db: leveldb
    orderer_batch: *orderer_batch_normalized
