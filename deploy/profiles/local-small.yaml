# Local profile for a ~13-14 GB host (the `local` profile needs 16 GB and will
# be refused by scripts/preflight.sh on a smaller machine).
#
#   Host OS         2 cores / 2 GB
#   Load generator  2 cores / 2 GB
#   Monitoring      1 core  / 1 GB
#   Platform under test        8 cores / 8 GB   <-- budget below
#
# Everything that is a FAIRNESS LEVER is identical to local.yaml: the same
# orderer_batch anchor, and state_db forced to leveldb for normalized runs by the
# engine. Only the resource envelope differs, and the manifest records it - so
# runs on this profile are comparable to each other, and NOT to runs on `local`.
# Absolute throughput will be lower than `local`; the shape of the curves is what
# carries over.
name: local-small
budget:
  total_cpus: 8
  total_memory_gb: 8
  load_gen_cpus: 2

# Identical to local.yaml - block-cutting must not vary across platforms OR
# profiles, or nothing is comparable (adr-011).
_orderer_batch_normalized: &orderer_batch_normalized
  max_message_count: 100
  absolute_max_bytes: "10 MB"
  preferred_max_bytes: "2 MB"
  batch_timeout: "1s"

_orderer_batch_native: &orderer_batch_native
  max_message_count: 500
  absolute_max_bytes: "10 MB"
  preferred_max_bytes: "4 MB"
  batch_timeout: "500ms"

_orderer_batch_native_bft: &orderer_batch_native_bft
  max_message_count: 250
  absolute_max_bytes: "10 MB"
  preferred_max_bytes: "4 MB"
  batch_timeout: "1s"

platforms:
  fabric-cft:
    nodes: {peer: 2, orderer: 1, chaincode: 2}
    state_db: leveldb
    orderer_batch: *orderer_batch_normalized
    orderer_batch_native: *orderer_batch_native

  fabric-bft:
    # SmartBFT needs 3f+1 orderers, minimum 4.
    nodes: {peer: 2, orderer: 4, chaincode: 2}
    state_db: leveldb
    orderer_batch: *orderer_batch_normalized
    orderer_batch_native: *orderer_batch_native_bft

  drunix:
    nodes: {lite_peer: 2, committing_peer: 2, validation_service: 2, orderer: 1, keydb: 2, yugabyte: 2, chaincode: 2}
    # Native backend. Normalized runs still request leveldb via the engine;
    # the shipped test-network only wires the full node set for Yugabyte.
    state_db: yugabyte
    orderer_batch: *orderer_batch_normalized
    orderer_batch_native: *orderer_batch_native

  fabricx:
    # Arma routers/batchers/consenters/assemblers plus the endorser, validator and
    # committer microservices. Heavily starved at this size - see
    # docs/architecture/fairness-guarantees.md.
    nodes: {arma: 1, postgres: 1, pipeline: 1, committer: 1}
    load_gen_cpus: 2
    state_db: postgres
    orderer_batch: *orderer_batch_normalized
    orderer_batch_native: *orderer_batch_native

  neuchain:
    nodes: {block_server: 4, epoch_server: 4}  # epoch servers co-located, one per block-server container
    load_gen_cpus: 2
    state_db: leveldb
    orderer_batch: {}

  mock:
    nodes: {node: 1}
    state_db: leveldb
    orderer_batch: *orderer_batch_normalized
