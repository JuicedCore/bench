# Single-VM GCP profile: one n2-standard-16 (16 vCPU / 64 GB) per platform run,
# load generator on a separate n2-standard-8, monitoring on an e2-standard-4.
# Same topology as local but with real memory headroom.
name: gcp-small
budget:
  total_cpus: 13
  total_memory_gb: 52
  load_gen_cpus: 8

_orderer_batch_normalized: &orderer_batch_normalized
  max_message_count: 100
  absolute_max_bytes: "10 MB"
  preferred_max_bytes: "2 MB"
  batch_timeout: "1s"

platforms:
  fabric-cft:
    nodes: {peer: 2, orderer: 1, chaincode: 2}
    state_db: leveldb
    orderer_batch: *orderer_batch_normalized
  fabric-bft:
    nodes: {peer: 2, orderer: 4, chaincode: 2}
    state_db: leveldb
    orderer_batch: *orderer_batch_normalized
  drunix:
    nodes: {lite_peer: 2, committing_peer: 2, validation_service: 2, orderer: 1, keydb: 2, yugabyte: 2, chaincode: 2}
    state_db: leveldb
    orderer_batch: *orderer_batch_normalized
  fabricx:
    nodes: {arma: 1, postgres: 1, pipeline: 1, committer: 1}
    load_gen_cpus: 8
    state_db: leveldb
    orderer_batch: *orderer_batch_normalized
  neuchain:
    nodes: {block_server: 4, epoch_server: 1}
    load_gen_cpus: 8
    state_db: leveldb
    orderer_batch: {}
