# GCP profile, large: the platform on one n2-standard-32 (32 vCPU / 128 GB), the
# load generator on its own n2-standard-16. Driven by scripts/gcp-run.sh, which
# sizes the VMs from the `gcp:` block below so hardware and budget cannot drift.
#
# One VM, not several: the deploy scripts run each platform on a single Docker
# host (docs/guides/gcp-deployment.md explains what that means for the scale-out
# designs). The budget leaves 4 vCPU / 16 GB for the OS, Docker and monitoring.
#
# Block cutting is the same normalized anchor as every other profile (adr-011), so
# the shape of a curve measured here can be compared with one measured locally.
name: gcp-full
budget:
  total_cpus: 28
  total_memory_gb: 112
  load_gen_cpus: 16

gcp:
  sut_machine_type: n2-standard-32
  loadgen_machine_type: n2-standard-16
  sut_disk_gb: 300

_orderer_batch_normalized: &orderer_batch_normalized
  max_message_count: 100
  absolute_max_bytes: "10 MB"
  preferred_max_bytes: "2 MB"
  batch_timeout: "1s"

_orderer_batch_native: &orderer_batch_native
  max_message_count: 500
  absolute_max_bytes: "10 MB"
  preferred_max_bytes: "4 MB"
  batch_timeout: "500ms"

_orderer_batch_native_bft: &orderer_batch_native_bft
  max_message_count: 250
  absolute_max_bytes: "10 MB"
  preferred_max_bytes: "4 MB"
  batch_timeout: "1s"

platforms:
  fabric-cft:
    nodes: {peer: 2, orderer: 1, chaincode: 2}
    state_db: leveldb
    orderer_batch: *orderer_batch_normalized
    orderer_batch_native: *orderer_batch_native
  fabric-bft:
    nodes: {peer: 2, orderer: 4, chaincode: 2}
    state_db: leveldb
    orderer_batch: *orderer_batch_normalized
    orderer_batch_native: *orderer_batch_native_bft
  drunix:
    nodes: {lite_peer: 2, committing_peer: 2, validation_service: 2, orderer: 1, keydb: 2, yugabyte: 2, chaincode: 2}
    state_db: yugabyte
    orderer_batch: *orderer_batch_normalized
    orderer_batch_native: *orderer_batch_native
  fabricx:
    nodes: {arma: 1, postgres: 1, pipeline: 1, committer: 1}
    state_db: postgres
    orderer_batch: *orderer_batch_normalized
    orderer_batch_native: *orderer_batch_native
  neuchain:
    nodes: {block_server: 4, epoch_server: 4}  # epoch servers co-located, one per block-server container
    state_db: leveldb
    orderer_batch: {}
