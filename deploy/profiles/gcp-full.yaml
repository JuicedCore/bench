# Multi-VM GCP profile: 4x n2-standard-8 node VMs (8 vCPU / 32 GB each) per
# platform, 1x n2-standard-4 load generator, 1x e2-standard-4 monitoring.
# Run platforms strictly sequentially on identical hardware
# (docs/decisions/adr-005-sequential-runs.md). This is the profile for numbers
# that can be quoted against published ceilings.
name: gcp-full
budget:
  total_cpus: 32
  total_memory_gb: 128
  load_gen_cpus: 4

_orderer_batch_normalized: &orderer_batch_normalized
  max_message_count: 500
  absolute_max_bytes: "99 MB"
  preferred_max_bytes: "2 MB"
  batch_timeout: "500ms"

platforms:
  fabric-cft:
    nodes: {peer: 2, orderer: 1, chaincode: 2}
    state_db: leveldb
    orderer_batch: *orderer_batch_normalized
  fabric-bft:
    nodes: {peer: 2, orderer: 4, chaincode: 2}
    state_db: leveldb
    orderer_batch: *orderer_batch_normalized
  drunix:
    nodes: {lite_peer: 2, committing_peer: 2, validation_service: 2, orderer: 1, keydb: 2, yugabyte: 2, chaincode: 2}
    state_db: leveldb
    orderer_batch: *orderer_batch_normalized
  fabricx:
    nodes: {arma: 1, postgres: 1, pipeline: 1, committer: 1}
    load_gen_cpus: 16
    state_db: leveldb
    orderer_batch: *orderer_batch_normalized
  neuchain:
    nodes: {block_server: 4, epoch_server: 1}
    load_gen_cpus: 16
    state_db: leveldb
    orderer_batch: {}
